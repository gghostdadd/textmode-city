<div id="ui">

<script>
'use strict';
// Textmode City: a looping rainy-night scene rendered through classic text-art character sets.
// The scene is drawn to a small canvas, sampled per character cell, and each mode turns
// those samples into glyphs. Every motion repeats a whole number of times per loop, so
// frame N and frame 0 meet seamlessly when the clip loops in Resolume.

const TAU = Math.PI * 2;
const Q = new URLSearchParams(location.search);
const qn = (k, d) => (Q.has(k) ? +Q.get(k) : d);

const MODES = {
  ascii:    { label: 'ASCII',               aspect: 1.8, cols: 160, sx: 4, sy: 4, palette: 'ansi' },
  blocks:   { label: 'ANSI blocks (CP437)', aspect: 2.0, cols: 160, sx: 2, sy: 4, palette: 'ansi' },
  petscii:  { label: 'PETSCII (C64)',       aspect: 1.0, cols: 96,  sx: 4, sy: 4, palette: 'c64' },
  teletext: { label: 'Teletext mosaic',     aspect: 1.5, cols: 80,  sx: 2, sy: 3, palette: 'teletext' },
  braille:  { label: 'Braille dots',        aspect: 2.0, cols: 192, sx: 2, sy: 4, palette: 'ansi' },
  lines:    { label: 'Box-drawing lines',   aspect: 2.0, cols: 120, sx: 4, sy: 4, palette: 'ansi' },
  custom:   { label: 'Custom characters',   aspect: 1.8, cols: 160, sx: 4, sy: 4, palette: 'ansi' },
};

const ANSI = ['#000000', '#aa0000', '#00aa00', '#aa5500', '#0000aa', '#aa00aa', '#00aaaa', '#aaaaaa',
              '#555555', '#ff5555', '#55ff55', '#ffff55', '#5555ff', '#ff55ff', '#55ffff', '#ffffff'];
const C64 = ['#000000', '#ffffff', '#68372b', '#70a4b2', '#6f3d86', '#588d43', '#352879', '#b8c76f',
             '#6f4f25', '#433900', '#9a6759', '#444444', '#6c6c6c', '#9ad284', '#6c5eb5', '#959595'];
const TTX = ['#000000', '#ff0000', '#00ff00', '#ffff00', '#0000ff', '#ff00ff', '#00ffff', '#ffffff'];

const ZX = ['#000000', '#0000d7', '#d70000', '#d700d7', '#00d700', '#00d7d7', '#d7d700', '#d7d7d7',
            '#0000ff', '#ff0000', '#ff00ff', '#00ff00', '#00ffff', '#ffff00', '#ffffff'];
const PICO8 = ['#000000', '#1d2b53', '#7e2553', '#008751', '#ab5236', '#5f574f', '#c2c3c7', '#fff1e8',
               '#ff004d', '#ffa300', '#ffec27', '#00e436', '#29adff', '#83769c', '#ff77a8', '#ffccaa'];

// fg: glyph colors. bg: cell background colors (only the blocks mode uses more than one).
// mono palettes are gradient maps: cells pick a colour by brightness, dark to light.
const colorSet = (label, cols, screen = '#000000') => ({ group: 'Color sets', label, fg: cols, bg: [screen, ...cols.slice(0, 3)], screen, border: screen });
const gradient = (label, ramp) => ({ group: 'Gradient maps', label, mono: true, fg: ramp.slice(1), bg: ramp.slice(0, 2), screen: ramp[0], border: ramp[0] });
const PALETTES = {
  ansi:      { group: 'Retro hardware', label: 'ANSI / VGA 16', fg: ANSI.slice(1), bg: ANSI.slice(0, 8), screen: '#000000', border: '#000000' },
  c64:       { group: 'Retro hardware', label: 'C64 blue screen', fg: C64.filter(c => c !== '#352879'), bg: C64, screen: '#352879', border: '#6c5eb5' },
  c64night:  { group: 'Retro hardware', label: 'C64 black screen', fg: C64.slice(1), bg: C64, screen: '#000000', border: '#000000' },
  teletext:  { group: 'Retro hardware', label: 'Teletext 8', fg: TTX.slice(1), bg: TTX, screen: '#000000', border: '#000000' },
  zx:        { group: 'Retro hardware', label: 'ZX Spectrum', fg: ZX.slice(1), bg: ZX.slice(0, 8), screen: '#000000', border: '#000000' },
  cga:       { group: 'Retro hardware', label: 'CGA cyan/magenta', fg: ['#55ffff', '#ff55ff', '#ffffff'], bg: ['#000000'], screen: '#000000', border: '#000000' },
  cgawarm:   { group: 'Retro hardware', label: 'CGA red/green/yellow', fg: ['#55ff55', '#ff5555', '#ffff55'], bg: ['#000000'], screen: '#000000', border: '#000000' },
  pico8:     { group: 'Retro hardware', label: 'PICO-8', fg: PICO8.slice(1), bg: PICO8.slice(0, 6), screen: '#000000', border: '#000000' },
  gameboy:   { group: 'Retro hardware', label: 'Game Boy', mono: true, fg: ['#306230', '#8bac0f', '#9bbc0f'], bg: ['#0f380f'], screen: '#0f380f', border: '#0f380f' },
  green:     { group: 'Retro hardware', label: 'Green phosphor', mono: true, fg: ['#0f3d12', '#1f7a24', '#33cc3a', '#66ff66', '#ccffcc'], bg: ['#000000', '#071a08'], screen: '#000000', border: '#000000' },
  amber:     { group: 'Retro hardware', label: 'Amber phosphor', mono: true, fg: ['#3d2200', '#7a4500', '#cc7a00', '#ffb000', '#ffd98a'], bg: ['#000000', '#1a0e00'], screen: '#000000', border: '#000000' },
  mono:      { group: 'Retro hardware', label: 'Mono white', mono: true, fg: ['#444444', '#777777', '#aaaaaa', '#dddddd', '#ffffff'], bg: ['#000000', '#222222'], screen: '#000000', border: '#000000' },
  truecolor: { group: 'Retro hardware', label: 'Truecolor', truecolor: true, fg: [], bg: ['#000000'], screen: '#000000', border: '#000000' },
  vapor:     colorSet('Vaporwave', ['#ff71ce', '#01cdfe', '#05ffa1', '#b967ff', '#fffb96', '#ffffff'], '#140b26'),
  neon:      colorSet('Neon night', ['#ff2a6d', '#05d9e8', '#d1f7ff', '#7700ff', '#ff9e00', '#ffffff'], '#05010f'),
  jungle:    colorSet('Jungle', ['#1b4d2a', '#2e8b3a', '#7ccf4a', '#d8f070', '#3ab0c0', '#e8fff0'], '#020a05'),
  pastel:    colorSet('Pastel', ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#bdb2ff', '#ffc6ff'], '#1a1622'),
  earth:     colorSet('Earth tones', ['#6b4f2a', '#a67c52', '#d9b88f', '#5a7a3a', '#9ab068', '#e8dcc0'], '#120d08'),
  sunset:    gradient('Sunset', ['#14051f', '#4a0f4f', '#a3195b', '#ff4f3a', '#ff9a3c', '#ffe29a']),
  ocean:     gradient('Ocean', ['#020b1a', '#0b2e5c', '#14609e', '#2fa4d8', '#8ee3ff', '#f0fdff']),
  fire:      gradient('Fire', ['#0a0000', '#4a0500', '#a01a00', '#ff5a00', '#ffb000', '#fff4c0']),
  ice:       gradient('Ice', ['#05070f', '#1c2a4a', '#3e5f9a', '#7aa8e0', '#c0e4ff', '#ffffff']),
  matrix:    gradient('Matrix', ['#000000', '#003b00', '#008f11', '#00c42e', '#00ff41', '#b4ffb4']),
  sepia:     gradient('Sepia', ['#0e0a06', '#3b2a1a', '#6b4a2a', '#a07a4a', '#d8b07a', '#f4e0b8']),
  synth:     gradient('Synthwave', ['#0d0221', '#2a0b5c', '#7b1fa2', '#e91e8c', '#ff6ec7', '#9ef0ff']),
  toxic:     gradient('Toxic', ['#050805', '#1e3a0a', '#4a8a10', '#a8e020', '#e8ff50', '#ffffff']),
};

const cfg = {
  scene: SCENES[Q.get('scene')] ? Q.get('scene') : 'city',
  mode: MODES[Q.get('mode')] ? Q.get('mode') : 'ascii',
  palette: PALETTES[Q.get('palette')] ? Q.get('palette') : 'native',
  cols: qn('cols', 0),
  chars: Q.get('chars') ?? '.,-~:;=!*#$@',
  black: qn('black', 0.05),
  gain: qn('gain', 1.35),
  dither: qn('dither', 0.6),
  hue: qn('hue', 0),
  sat: qn('sat', 1),
  density: qn('density', 1),
  seed: qn('seed', 7),
  loop: qn('loop', 8),
  fps: qn('fps', 30),
  crt: Q.get('crt') === '1',
  pan: Q.get('pan') === '1',
  w: qn('w', 1920),
  h: qn('h', 1080),
};
const EXPORT = Q.get('export') === '1';

// ---------- small helpers ----------
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(a, b) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b + 0x9e3779b9) | 0, 0x85ebca6b);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12;
  return (h >>> 0) / 4294967296;
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
function rgbHex(r, g, b) {
  return '#' + ((1 << 24) | (Math.round(clamp(r) * 255) << 16) | (Math.round(clamp(g) * 255) << 8) | Math.round(clamp(b) * 255)).toString(16).slice(1);
}
function mixCss(a, b, t) {
  const x = hexRgb(a), y = hexRgb(b);
  return rgbHex(x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t);
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

// ---------- glyph sets ----------
function bitmap(fn, w = 8, h = 8) {
  const rows = [];
  for (let y = 0; y < h; y++) { let b = 0; for (let x = 0; x < w; x++) if (fn(x, y)) b |= 1 << (w - 1 - x); rows.push(b); }
  return rows;
}
function mask4(rows, w) {
  const h = rows.length, m = new Float32Array(16), cell = (w / 4) * (h / 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if ((rows[y] >> (w - 1 - x)) & 1) m[Math.floor((y * 4) / h) * 4 + Math.floor((x * 4) / w)] += 1 / cell;
  return m;
}
function glyphSet(masks, lam) {
  const n = masks.length, flat = new Float32Array(n * 16), means = new Float32Array(n);
  masks.forEach((m, i) => { flat.set(m, i * 16); means[i] = m.reduce((a, b) => a + b, 0) / 16; });
  return { n, masks: flat, means, lam };
}
function match(set, s, mean) {
  const { n, masks, means, lam } = set;
  let best = 0, be = Infinity;
  for (let gi = 0; gi < n; gi++) {
    const o = gi * 16;
    // Start from the density term and stop as soon as this glyph can't beat the best so far.
    const dm = means[gi] - mean;
    let e = lam * 16 * dm * dm;
    for (let k = 0; k < 16 && e < be; k++) { const d = masks[o + k] - s[k]; e += d * d; }
    if (e < be) { be = e; best = gi; }
  }
  return best;
}

// PETSCII-style 8x8 graphics: all 16 quadrant combos, triangles, checkers, bars, diagonals, balls.
const PET = [];
for (let q = 0; q < 16; q++) PET.push(bitmap((x, y) => (q >> ((y >= 4 ? 2 : 0) + (x >= 4 ? 1 : 0))) & 1));
[
  (x, y) => x + y >= 7, (x, y) => x <= y, (x, y) => x + y <= 7, (x, y) => x >= y,
  (x, y) => (x + y) % 2 === 0,
  (x, y) => x < 4 && (x + y) % 2 === 0, (x, y) => x >= 4 && (x + y) % 2 === 0,
  (x, y) => y < 4 && (x + y) % 2 === 0, (x, y) => y >= 4 && (x + y) % 2 === 0,
  (x, y) => y === 3 || y === 4, (x, y) => x === 3 || x === 4, (x, y) => y === 3 || y === 4 || x === 3 || x === 4,
  (x, y) => y < 2, (x, y) => y >= 6, (x, y) => x < 2, (x, y) => x >= 6,
  (x, y) => Math.abs(x + y - 7) <= 1, (x, y) => Math.abs(x - y) <= 1,
  (x, y) => Math.abs(x + y - 7) <= 1 || Math.abs(x - y) <= 1,
  (x, y) => (x - 3.5) ** 2 + (y - 3.5) ** 2 <= 13,
  (x, y) => { const d = (x - 3.5) ** 2 + (y - 3.5) ** 2; return d <= 13 && d >= 5; },
  (x, y) => (x - 3.5) ** 2 + (y - 3.5) ** 2 <= 3,
].forEach(fn => PET.push(bitmap(fn)));
const PET_SET = glyphSet(PET.map(r => mask4(r, 8)), 1.5);

// CP437 blocks on an 8x16 cell, with the shade glyphs' coverage used for colour mixing.
const BLK = {
  ' ': { rows: bitmap(() => 0, 8, 16), a: 0 },
  '░': { rows: bitmap((x, y) => (y % 2 ? x % 4 === 2 : x % 4 === 0), 8, 16), a: 0.25 },
  '▒': { rows: bitmap((x, y) => (x + y) % 2 === 0, 8, 16), a: 0.5 },
  '▓': { rows: bitmap((x, y) => !(y % 2 ? x % 4 === 2 : x % 4 === 0), 8, 16), a: 0.75 },
  '█': { rows: bitmap(() => 1, 8, 16), a: 1 },
  '▀': { rows: bitmap((x, y) => y < 8, 8, 16) },
  '▄': { rows: bitmap((x, y) => y >= 8, 8, 16) },
  '▌': { rows: bitmap(x => x < 4, 8, 16) },
  '▐': { rows: bitmap(x => x >= 4, 8, 16) },
};

// Box-drawing: centre arms N=1 E=2 S=4 W=8 (all 16 combos), then ╱ ╲ ╳, a centre dot and a small box.
const LINE_DEFS = [];
for (let b = 0; b < 16; b++) LINE_DEFS.push(bitmap((x, y) =>
  ((b & 1) && (x === 3 || x === 4) && y <= 4) || ((b & 2) && (y === 3 || y === 4) && x >= 3) ||
  ((b & 4) && (x === 3 || x === 4) && y >= 3) || ((b & 8) && (y === 3 || y === 4) && x <= 4)));
LINE_DEFS.push(bitmap((x, y) => Math.abs(x + y - 7) <= 1), bitmap((x, y) => Math.abs(x - y) <= 1),
  bitmap((x, y) => Math.abs(x + y - 7) <= 1 || Math.abs(x - y) <= 1), bitmap((x, y) => x >= 3 && x <= 4 && y >= 3 && y <= 4),
  bitmap((x, y) => x >= 1 && x <= 6 && y >= 1 && y <= 6 && (x === 1 || x === 6 || y === 1 || y === 6)));
const LINE_SET = glyphSet(LINE_DEFS.map(r => mask4(r, 8)), 1.0);

const ASCII_CHARS = " .,:;'`-_~^\"=+*!|/\\()[]<>{}ilxoO0#%&@$MW";
let ASCII, CUSTOM;
const fontAt = px => `bold ${px.toFixed(1)}px Menlo, Monaco, Consolas, "Courier New", monospace`;

// Splits typed text into user-perceived characters (so emoji and accents stay whole),
// drops whitespace and repeats, and always puts the blank cell first.
function splitChars(str) {
  const out = [' '];
  for (const { segment } of new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(str)) {
    if (!/^\s+$/.test(segment) && !out.includes(segment)) out.push(segment);
  }
  return out;
}

// Widest glyph advance as a fraction of the font size (monospace Latin is about 0.6).
function glyphWidth(chars) {
  const g = document.createElement('canvas').getContext('2d');
  g.font = fontAt(100);
  return Math.max(0, ...chars.filter(c => c !== ' ').map(c => g.measureText(c).width / 100));
}

// Renders every glyph at cell size and measures its ink on a 4x4 grid. Glyphs wider than a
// cell (CJK, emoji) are shrunk to fit. `ramp` lists the glyphs used for flat areas.
function buildCharset(chars, ramp) {
  const base = Math.max(6, Math.min(ch * 0.92, cw / 0.62));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  const masks = [], fonts = [], dys = [];
  for (const chr of chars) {
    g.font = fontAt(base);
    const w = g.measureText(chr).width, fs = w > cw * 0.96 ? (base * cw * 0.96) / w : base;
    fonts.push(fontAt(fs)); dys.push(fs * 0.06);
    g.font = fonts[fonts.length - 1];
    g.clearRect(0, 0, cw, ch); g.fillText(chr, cw / 2, ch / 2 + dys[dys.length - 1]);
    const d = g.getImageData(0, 0, cw, ch).data, m = new Float32Array(16), cnt = new Float32Array(16);
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      const k = Math.floor((y * 4) / ch) * 4 + Math.floor((x * 4) / cw);
      m[k] += d[(y * cw + x) * 4 + 3] / 255; cnt[k]++;
    }
    for (let k = 0; k < 16; k++) m[k] /= cnt[k] || 1;
    masks.push(m);
  }
  // Scale ink coverage so the densest glyph stands in for a fully lit cell.
  const top = Math.max(1e-6, ...masks.map(m => m.reduce((a, b) => a + b, 0) / 16));
  for (const m of masks) for (let k = 0; k < 16; k++) m[k] = Math.min(1, (m[k] / top) * 0.9);
  return { chars, fonts, dys, set: glyphSet(masks, 1.2), ramp: ramp ? [...ramp].map(r => chars.indexOf(r)) : chars.map((_, i) => i) };
}
// Flat cells read better as a plain density ramp than as the closest-shaped glyph.
function rampGlyph(cs, mean) {
  let best = 0, be = Infinity;
  for (const gi of cs.ramp) { const e = Math.abs(cs.set.means[gi] - mean); if (e < be) { be = e; best = gi; } }
  return best;
}

// ---------- palette ----------
let pal, memo;
function resolvePalette() {

$('cols').oninput = e => change(() => { cfg.cols = +e.target.value; });
for (const k of ['black', 'gain', 'dither', 'hue', 'sat']) $(k).oninput = e => change(() => { cfg[k] = +e.target.value; }, false);
$('density').oninput = e => change(() => { cfg.density = +e.target.value; });
$('seed').onchange = e => change(() => { cfg.seed = Math.max(1, +e.target.value | 0); });
$('res').onchange = e => change(() => { [cfg.w, cfg.h] = e.target.value.split('x').map(Number); });
$('loop').onchange = e => change(() => { cfg.loop = +e.target.value; frame = 0; });
$('fps').onchange = e => change(() => { cfg.fps = +e.target.value; frame = 0; });
$('crt').onchange = e => change(() => { cfg.crt = e.target.checked; }, false);
$('pan').onchange = e => change(() => { cfg.pan = e.target.checked; }, false);
$('play').onclick = () => { playing = !playing; syncUI(); };
$('copy').onclick = async () => {
  const cmd = `npm run export -- "${exportQuery()}"`;
  try { await navigator.clipboard.writeText(cmd); $('copy').textContent = 'Copied!'; }
  catch { prompt('Export command:', cmd); }
  setTimeout(() => ($('copy').textContent = 'Copy export cmd'), 1200);
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const modes = Object.keys(MODES);
  if (e.key === 'h' || e.key === 'H') ui.classList.toggle('hidden');
  else if (e.key === ' ') { playing = !playing; syncUI(); e.preventDefault(); }
  else if (e.key >= '1' && e.key <= String(modes.length)) change(() => { cfg.mode = modes[+e.key - 1]; cfg.cols = 0; });
  else if (e.key === ',' || e.key === '.') { playing = false; frame = render(frame + (e.key === '.' ? 1 : -1)); syncUI(); status(); }
});

function tick(now) {
  if (playing) {
    acc += last ? Math.min(now - last, 100) : 0;
    const step = 1000 / cfg.fps;
    if (acc >= step) { const n = Math.floor(acc / step); acc -= n * step; frame = render(frame + n); status(); }
  }
  last = now;
  requestAnimationFrame(tick);
}

rebuild();
render(0);
if (EXPORT) {
  ui.classList.add('hidden');
  document.fonts.ready.then(() => {
    rebuild();
    window.textmode = {
      ready: true,
      total: () => total,
      renderFrame: i => { render(i); return out.toDataURL('image/png'); },
    };
  });
} else {
  syncUI(); status();
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
